# DARK_MATTER_TRACE_V10
name: Dark Matter Cloud Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Task instructions from Dark Matter mobile'
        required: true
        type: string
      model:
        description: 'OpenCode model ID (e.g. opencode/big-pickle)'
        required: false
        default: 'opencode/big-pickle'
        type: string
      agent:
        description: 'Agent profile (build or plan)'
        required: false
        default: 'build'
        type: string
      thread_id:
        description: 'Dark Matter thread ID'
        required: false
        default: ''
        type: string
      target_branch:
        description: 'Branch selected by user to inspect or push commits'
        required: false
        default: ''
        type: string
      branch_strategy:
        description: 'direct or new_pr_branch'
        required: false
        default: 'direct'
        type: string
      keep_alive_minutes:
        description: 'Runner timeout/keep-alive window in minutes (360 for public, 40 for private)'
        required: false
        default: '360'
        type: string
      thinking:
        description: 'Enable extended reasoning trace for complex queries (true/false)'
        required: false
        default: 'true'
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  id-token: write

jobs:
  opencode-mobile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.keep_alive_minutes || '360') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Cache OpenCode CLI
        id: cache-opencode
        uses: actions/cache@v4
        with:
          path: |
            ~/.opencode-cli
            ~/.local/share/opencode
            ~/.cache/opencode
          key: ${{ runner.os }}-opencode-cli-v2
          restore-keys: |
            ${{ runner.os }}-opencode-cli-

      - name: Prepare OpenCode CLI
        run: |
          mkdir -p "$HOME/.opencode-cli/node_modules/.bin"
          if [ ! -x "$HOME/.opencode-cli/node_modules/.bin/opencode" ]; then
            npm install --prefix "$HOME/.opencode-cli" --no-save --silent opencode-ai@latest
          fi
          cat << 'WEBSEARCH_EOF' > "$HOME/.opencode-cli/node_modules/.bin/dm-websearch"
          #!/usr/bin/env node
          const https = require('https');
          const q = process.argv.slice(2).join(' ').trim();
          if (!q) {
            console.log('Usage: dm-websearch "<search query or https://url>"');
            process.exit(0);
          }
          function get(url, headers = {}) {
            return new Promise((resolve) => {
              const req = https.get(url, {
                headers: Object.assign({
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36',
                  'Accept': 'text/html,application/json;q=0.9,*/*;q=0.8'
                }, headers),
                timeout: 8000
              }, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  const next = res.headers.location.startsWith('http')
                    ? res.headers.location
                    : new URL(res.headers.location, url).toString();
                  resolve(get(next, headers));
                  return;
                }
                let data = '';
                res.on('data', (c) => { if (data.length < 220000) data += c; });
                res.on('end', () => resolve(data));
              });
              req.on('error', () => resolve(''));
              req.on('timeout', () => { req.destroy(); resolve(''); });
            });
          }
          function stripHtml(html) {
            return String(html || '')
              .replace(/<script[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style[\s\S]*?<\/style>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#x27;/g, "'").replace(/&nbsp;/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();
          }
          (async () => {
            if (/^https?:\/\//i.test(q)) {
              const raw = await get(q);
              console.log('URL: ' + q + '\n\n' + stripHtml(raw).slice(0, 7000));
              return;
            }
            const ddgUrl = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(q);
            const html = await get(ddgUrl);
            const results = [];
            const re = /<a[^>]+class="[^"]*result__a[^"]*"[^>]+href="([^"]+)"[^>]*>([\s\S]*?)<\/a>[\s\S]*?(?:<a[^>]+class="[^"]*result__snippet[^"]*"[^>]*>([\s\S]*?)<\/a>|<div[^>]+class="[^"]*result__snippet[^"]*"[^>]*>([\s\S]*?)<\/div>)/gi;
            let m;
            while ((m = re.exec(html)) && results.length < 6) {
              let link = m[1] || '';
              const uddg = link.match(/[?&]uddg=([^&]+)/);
              if (uddg) link = decodeURIComponent(uddg[1]);
              const title = stripHtml(m[2]);
              const snippet = stripHtml(m[3] || m[4] || '');
              if (title && link) results.push({ title, url: link, snippet });
            }
            if (results.length === 0) {
              const wikiUrl = 'https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + encodeURIComponent(q) + '&utf8=&format=json&srlimit=5';
              const wikiRaw = await get(wikiUrl);
              try {
                const j = JSON.parse(wikiRaw);
                for (const item of (j.query && j.query.search) || []) {
                  results.push({
                    title: item.title,
                    url: 'https://en.wikipedia.org/wiki/' + encodeURIComponent(item.title.replace(/ /g, '_')),
                    snippet: stripHtml(item.snippet || '')
                  });
                }
              } catch {}
            }
            if (results.length === 0) {
              console.log('No direct web matches found for: ' + q);
            } else {
              results.forEach((r, i) => {
                console.log((i + 1) + '. ' + r.title + '\n   URL: ' + r.url + '\n   ' + r.snippet + '\n');
              });
            }
          })();
          WEBSEARCH_EOF
          chmod +x "$HOME/.opencode-cli/node_modules/.bin/dm-websearch"
          echo "$HOME/.opencode-cli/node_modules/.bin" >> "$GITHUB_PATH"
          ACTOR_NAME="${GITHUB_ACTOR:-${GITHUB_REPOSITORY_OWNER:-developer}}"
          ACTOR_ID="${GITHUB_ACTOR_ID:-}"
          if [ -n "$ACTOR_ID" ]; then
            ACTOR_EMAIL="${ACTOR_ID}+${ACTOR_NAME}@users.noreply.github.com"
          else
            ACTOR_EMAIL="${ACTOR_NAME}@users.noreply.github.com"
          fi
          git config user.name "$ACTOR_NAME"
          git config user.email "$ACTOR_EMAIL"

      - name: Run OpenCode CLI
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DM_GITHUB_REPOSITORY: ${{ github.repository }}
          DM_GITHUB_RUN_ID: ${{ github.run_id }}
          DM_GITHUB_SHA: ${{ github.sha }}
          NO_COLOR: "1"
          OPENCODE_CONFIG: "/tmp/dark-matter-opencode.json"
          TASK_PROMPT: ${{ inputs.prompt }}
          TASK_MODEL: ${{ inputs.model || 'opencode/big-pickle' }}
          TASK_AGENT: ${{ inputs.agent || 'build' }}
          TASK_THREAD_ID: ${{ inputs.thread_id }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
          BRANCH_STRATEGY: ${{ inputs.branch_strategy || 'direct' }}
          DEFAULT_BRANCH: ${{ github.ref_name }}
          TASK_THINKING: ${{ inputs.thinking || 'true' }}
        run: |
          MODEL="${TASK_MODEL:-opencode/big-pickle}"
          AGENT_MODE="${TASK_AGENT:-build}"
          RAW_JSON_FILE="/tmp/opencode_events.jsonl"
          OUT_FILE="/tmp/opencode_reply.txt"
          ERR_FILE="/tmp/opencode_err.txt"
          TRACE_B64_FILE="/tmp/opencode_trace.b64"
          INITIAL_HEAD_SHA=$(git rev-parse HEAD 2>/dev/null || true)
          DM_START_MARKER="/tmp/dm_run_started_marker"
          touch "$DM_START_MARKER" 2>/dev/null || true

          if [ "$AGENT_MODE" = "plan" ]; then
            printf '{"permission":{"*":"deny","read":"allow","glob":"allow","grep":"allow","list":"allow","webfetch":"allow","websearch":"allow","fetch":"allow","search":"allow","bash":"allow"}}' > /tmp/dark-matter-opencode.json
            export OPENCODE_PERMISSION='{"*":"deny","read":"allow","glob":"allow","grep":"allow","list":"allow","webfetch":"allow","websearch":"allow","fetch":"allow","search":"allow","bash":"allow"}'
            INSTRUCTIONS="$TASK_PROMPT"
          else
            printf '{"permission":"allow"}' > /tmp/dark-matter-opencode.json
            export OPENCODE_PERMISSION='{"*":"allow"}'
            INSTRUCTIONS="$TASK_PROMPT"
          fi

          FLAGS_CACHE_FILE="$HOME/.opencode-cli/.run_flags_v1"
          if [ -f "$FLAGS_CACHE_FILE" ]; then
            HELP_TEXT=$(cat "$FLAGS_CACHE_FILE" 2>/dev/null || true)
          else
            HELP_TEXT=$(opencode run --help 2>&1 || true)
            mkdir -p "$HOME/.opencode-cli" 2>/dev/null || true
            printf '%s' "$HELP_TEXT" > "$FLAGS_CACHE_FILE" 2>/dev/null || true
          fi
          OPENCODE_FLAGS=()
          if printf '%s' "$HELP_TEXT" | grep -q -- '--format'; then
            OPENCODE_FLAGS+=(--format json)
          fi
          if [ "$TASK_THINKING" != "false" ] && printf '%s' "$HELP_TEXT" | grep -q -- '--thinking'; then
            OPENCODE_FLAGS+=(--thinking)
          fi
          if printf '%s' "$HELP_TEXT" | grep -q -- '--agent'; then
            OPENCODE_FLAGS+=(--agent "$AGENT_MODE")
          fi

          cat << 'NODE_EOF' > /tmp/dm_live.js
          const fs = require('fs');
          const https = require('https');
          const readline = require('readline');
          const { execFileSync } = require('child_process');

          const rawFile = '/tmp/opencode_events.jsonl';
          const outFile = '/tmp/opencode_reply.txt';
          const traceFile = '/tmp/opencode_trace.b64';
          const modelName = process.env.TASK_MODEL || 'opencode/big-pickle';
          const agentMode = process.env.TASK_AGENT || 'build';
          const ghToken = process.env.GH_TOKEN || '';
          const ghRepo = process.env.DM_GITHUB_REPOSITORY || '';
          const ghRunId = String(process.env.DM_GITHUB_RUN_ID || '');
          const ghSha = process.env.DM_GITHUB_SHA || '';
          const workspaceRoot = (process.env.GITHUB_WORKSPACE || process.cwd() || '').replace(/\/+$/, '');

          try { fs.writeFileSync(rawFile, ''); } catch {}

          const thinkChunks = [];
          let roundTextBuffer = [];
          const allTextChunks = [];
          const nonJsonLines = [];
          const reads = new Set();
          const writes = new Set();
          const shell = new Set();
          const searches = new Set();
          const subagents = new Set();
          const skills = new Set();
          const steps = [];
          const events = [];
          const eventIndexByCallId = new Map();
          const rawPathsForPreview = new Set();
          const imagePreviews = {};
          let parsedAnyJson = false;
          let turnCount = 0;
          let totalOutputTokens = 0;
          let totalReasoningTokens = 0;
          let lastFinishReason = '';
          let liveStep = 'Invoking ' + modelName + ' (' + agentMode + ' mode)';
          let activePhase = 'workflow';
          let activeTask = 'Starting ' + modelName;
          let activeThoughtIdx = -1;
          let activeThoughtStartMs = 0;

          function normalizePath(p) {
            let s = String(p || '').trim();
            if (!s) return '';
            if (workspaceRoot && s.startsWith(workspaceRoot + '/')) {
              s = s.slice(workspaceRoot.length + 1);
            } else if (workspaceRoot && s === workspaceRoot) {
              s = '.';
            }
            s = s.replace(/^\/?home\/runner\/work\/[^\/]+\/[^\/]+\//, '');
            if (s.startsWith('./')) s = s.slice(2);
            return s;
          }

          function shortPath(p) {
            const norm = normalizePath(p);
            const parts = norm.split('/').filter(Boolean);
            return parts.length <= 2 ? norm : parts.slice(-2).join('/');
          }

          function addStep(label) {
            const clean = String(label || '').replace(/\s+/g, ' ').trim().slice(0, 120);
            if (!clean) return;
            liveStep = clean;
            if (steps.length < 36 && steps[steps.length - 1] !== clean) {
              steps.push(clean);
            }
          }

          function pushEvent(evt) {
            if (!evt || !evt.kind) return;
            if (events.length < 48) {
              events.push(evt);
              return events.length - 1;
            }
            return -1;
          }

          function closeActiveThought(nowMs) {
            if (activeThoughtIdx >= 0 && events[activeThoughtIdx]) {
              const elapsed = Math.max(100, (nowMs || Date.now()) - activeThoughtStartMs);
              events[activeThoughtIdx].durationMs = elapsed;
              events[activeThoughtIdx].status = 'completed';
              activeThoughtIdx = -1;
              activeThoughtStartMs = 0;
            }
          }

          function appendThinking(rawChunk, isDelta) {
            const text = String(rawChunk || '');
            if (!text.trim()) return;
            const nowMs = Date.now();
            if (isDelta && thinkChunks.length > 0 && activeThoughtIdx >= 0 && events[activeThoughtIdx]) {
              thinkChunks[thinkChunks.length - 1] += text;
              events[activeThoughtIdx].detail = thinkChunks[thinkChunks.length - 1].trim().slice(0, 1200);
              events[activeThoughtIdx].durationMs = Math.max(100, nowMs - activeThoughtStartMs);
            } else {
              const trimmed = text.trim();
              const prev = thinkChunks.length > 0 ? thinkChunks[thinkChunks.length - 1].trim() : '';
              if (prev && trimmed.startsWith(prev) && trimmed.length >= prev.length && activeThoughtIdx >= 0 && events[activeThoughtIdx]) {
                thinkChunks[thinkChunks.length - 1] = trimmed;
                events[activeThoughtIdx].detail = trimmed.slice(0, 1200);
                events[activeThoughtIdx].durationMs = Math.max(100, nowMs - activeThoughtStartMs);
              } else if (prev !== trimmed) {
                closeActiveThought(nowMs);
                thinkChunks.push(trimmed);
                activeThoughtStartMs = nowMs;
                activeThoughtIdx = pushEvent({
                  kind: 'thought',
                  tool: '',
                  title: 'Thought',
                  detail: trimmed.slice(0, 1200),
                  output: '',
                  durationMs: 0,
                  status: 'running',
                });
              }
            }
            activePhase = 'thinking';
            activeTask = 'Thinking';
            const latestPreview = thinkChunks[thinkChunks.length - 1].trim().split(/\r?\n/).pop() || '';
            if (latestPreview) {
              liveStep = 'Thinking: ' + latestPreview.slice(0, 72);
            }
          }

          function flushRoundTextAsNarration() {
            if (roundTextBuffer.length === 0) return;
            const joined = roundTextBuffer.join('').trim();
            roundTextBuffer = [];
            if (joined) {
              closeActiveThought(Date.now());
              pushEvent({
                kind: 'text',
                tool: '',
                title: '',
                detail: joined.slice(0, 1000),
                output: '',
                durationMs: 0,
                status: 'completed',
              });
            }
          }

          function addSkillIfSkillPath(p) {
            if (!p) return;
            const norm = String(p);
            const m = norm.match(/(?:^|\/)([^\/]+)\/SKILL\.md$/i);
            if (m && m[1]) {
              skills.add(m[1]);
              addStep('Loaded skill: ' + m[1]);
            } else if (/\.opencode\/skills\/([^\/]+)/i.test(norm)) {
              const sk = norm.match(/\.opencode\/skills\/([^\/]+)/i)[1];
              skills.add(sk);
              addStep('Loaded skill: ' + sk);
            }
          }

          function extractOutputSnippet(st) {
            if (!st || typeof st !== 'object') return '';
            const rawOut = st.output || st.result || (st.metadata && st.metadata.output) || '';
            if (typeof rawOut !== 'string') return '';
            return rawOut.replace(/\r\n/g, '\n').trim().slice(0, 220);
          }

          function computeToolDuration(st) {
            if (!st || typeof st !== 'object' || !st.time) return 0;
            const start = Number(st.time.start || 0);
            const end = Number(st.time.end || 0);
            return start > 0 && end > start ? Math.max(1, end - start) : 0;
          }

          function recordTool(nameRaw, inputObj, stateObj, callId) {
            const nowMs = Date.now();
            closeActiveThought(nowMs);
            flushRoundTextAsNarration();

            const name = String(nameRaw || '').toLowerCase();
            const inp = inputObj && typeof inputObj === 'object' ? inputObj : {};
            const st = stateObj && typeof stateObj === 'object' ? stateObj : {};
            const title = typeof st.title === 'string' ? normalizePath(st.title.trim()) : '';
            const statusStr = typeof st.status === 'string' ? st.status.toLowerCase() : 'completed';
            const rawPath = inp.filePath || inp.file_path || inp.path || inp.file || inp.target || inp.filename || inp.dir || inp.directory || '';
            const normPath = normalizePath(rawPath);
            const outputSnippet = extractOutputSnippet(st);
            const durationMs = computeToolDuration(st);
            if (rawPath && /\.(png|jpe?g|webp|gif|bmp)$/i.test(String(rawPath))) {
              rawPathsForPreview.add(String(rawPath));
            }

            let eventObj = {
              kind: 'tool',
              tool: name || 'tool',
              title: title || name,
              detail: normPath || title,
              output: outputSnippet,
              durationMs: durationMs,
              status: statusStr,
            };

            if (name.includes('websearch') || name.includes('web_search') || name.includes('search_web')) {
              const target = String(inp.query || inp.q || inp.prompt || title || '');
              const cleanTarget = target.slice(0, 140);
              if (cleanTarget) {
                searches.add('web: ' + cleanTarget);
                addStep('Searched web: ' + cleanTarget.slice(0, 72));
              }
              activePhase = 'tool';
              activeTask = 'Searching web';
              eventObj = { ...eventObj, tool: 'websearch', title: '1 search', detail: cleanTarget };
            } else if (name.includes('webfetch') || name === 'fetch') {
              const target = String(inp.url || inp.query || normPath || title || '');
              const cleanTarget = target.slice(0, 140);
              if (cleanTarget) {
                searches.add('web: ' + cleanTarget);
                addStep('Fetched: ' + cleanTarget.slice(0, 72));
              }
              activePhase = 'tool';
              activeTask = 'Fetching page';
              eventObj = { ...eventObj, tool: 'webfetch', title: '1 fetch', detail: cleanTarget };
            } else if (name === 'read' || name.includes('read_file') || name.includes('read_repo') || name === 'view_file' || name === 'cat') {
              const target = normPath || title;
              if (target) {
                reads.add(target);
                addStep('Read ' + shortPath(target));
                addSkillIfSkillPath(target);
              }
              activePhase = 'tool';
              activeTask = target ? ('Reading ' + shortPath(target)) : 'Reading file';
              eventObj = { ...eventObj, tool: 'read', title: shortPath(target), detail: target };
            } else if (name.includes('write') && !name.includes('todo')) {
              const target = normPath || title;
              if (target) {
                writes.add(target);
                addStep('Edited ' + shortPath(target));
              }
              activePhase = 'tool';
              activeTask = target ? ('Writing ' + shortPath(target)) : 'Writing file';
              eventObj = { ...eventObj, tool: 'write', title: shortPath(target), detail: target };
            } else if (name.includes('edit') || name.includes('patch') || name.includes('replace')) {
              const target = normPath || title;
              if (target) {
                writes.add(target);
                addStep('Edited ' + shortPath(target));
              }
              activePhase = 'tool';
              activeTask = target ? ('Editing ' + shortPath(target)) : 'Editing file';
              eventObj = { ...eventObj, tool: 'edit', title: shortPath(target), detail: target };
            } else if (name.includes('delete') || name.includes('remove') || name.includes('unlink')) {
              const target = normPath || title;
              if (target) {
                writes.add(target);
                addStep('Deleted ' + shortPath(target));
              }
              activePhase = 'tool';
              activeTask = target ? ('Deleting ' + shortPath(target)) : 'Deleting file';
              eventObj = { ...eventObj, tool: 'delete', title: shortPath(target), detail: target };
            } else if (name.includes('bash') || name.includes('shell') || name.includes('exec') || name.includes('command')) {
              const cmd = inp.command || inp.cmd || inp.script || title || '';
              const line = String(cmd).trim();
              if (line) {
                shell.add(line.split('\n')[0].slice(0, 140));
                const dmMatch = line.match(/dm-websearch\s+["']?([^"'\n]+)["']?/i);
                if (dmMatch && dmMatch[1]) {
                  const wq = dmMatch[1].trim().slice(0, 90);
                  searches.add('web: ' + wq);
                  addStep('Searched web: ' + wq.slice(0, 72));
                  activePhase = 'tool';
                  activeTask = 'Searching web';
                  eventObj = { ...eventObj, tool: 'websearch', title: '1 search', detail: wq };
                } else {
                  addStep('Executed shell: ' + (title || line.split('\n')[0]).slice(0, 72));
                  activePhase = 'tool';
                  activeTask = 'Running shell';
                  eventObj = { ...eventObj, tool: 'bash', title: title || line.split('\n')[0].slice(0, 64), detail: line.slice(0, 260) };
                }
              } else {
                activePhase = 'tool';
                activeTask = 'Running shell';
              }
            } else if (name.includes('grep') || name.includes('glob') || name.includes('find') || name.includes('list') || name === 'codesearch' || name === 'ls') {
              const q = normalizePath(inp.pattern || inp.query || inp.glob || inp.path || inp.filePath || inp.file_path || title || '');
              if (q) {
                searches.add(name + ': ' + String(q).slice(0, 80));
                addStep('Searched ' + name + ': ' + String(q).slice(0, 64));
              }
              activePhase = 'tool';
              activeTask = (name === 'glob' || name === 'list' || name === 'ls') ? 'Listing files' : 'Searching code';
              eventObj = { ...eventObj, tool: name, title: title || name, detail: String(q).slice(0, 140) };
            } else if (name.includes('task') || name.includes('subagent') || name === 'agent') {
              const stType = inp.subagent_type || inp.agent || 'subagent';
              const desc = inp.description ? String(inp.description).slice(0, 100) : '';
              subagents.add(String(stType) + (desc ? ': ' + desc : ''));
              addStep('Launched sub-agent: ' + String(stType) + (desc ? ': ' + desc : ''));
              activePhase = 'tool';
              activeTask = 'Running sub-agent';
              eventObj = { ...eventObj, tool: 'task', title: String(stType), detail: desc || title };
            } else if (name.includes('skill')) {
              const sname = inp.name || inp.skill || normPath || title || 'skill';
              skills.add(String(sname));
              addStep('Loaded skill: ' + String(sname));
              activePhase = 'tool';
              activeTask = 'Loading skill';
              eventObj = { ...eventObj, tool: 'skill', title: String(sname), detail: String(sname) };
            } else if (name.includes('todo')) {
              const count = Array.isArray(inp.todos) ? inp.todos.length : 0;
              const lbl = title || (count > 0 ? 'Updated task checklist (' + count + ' items)' : 'Updated task checklist');
              addStep(lbl);
              activePhase = 'tool';
              activeTask = 'Updating tasks';
              eventObj = { ...eventObj, tool: 'todo', title: 'Tasks', detail: lbl };
            } else if (name.includes('question')) {
              addStep('Prepared clarifying question');
              activePhase = 'tool';
              activeTask = 'Preparing question';
              eventObj = { ...eventObj, tool: 'question', title: 'AskQuestion', detail: title || 'Clarifying question' };
            } else if (title || name) {
              addStep(title || ('Ran tool: ' + name));
              activePhase = 'tool';
              activeTask = 'Running ' + (name || 'tool');
            }

            if (callId && eventIndexByCallId.has(callId)) {
              const idx = eventIndexByCallId.get(callId);
              if (idx >= 0 && events[idx]) {
                events[idx] = {
                  ...events[idx],
                  ...eventObj,
                  output: eventObj.output || events[idx].output,
                  durationMs: eventObj.durationMs || events[idx].durationMs,
                };
                return;
              }
            }
            const insertedIdx = pushEvent(eventObj);
            if (callId && insertedIdx >= 0) {
              eventIndexByCallId.set(callId, insertedIdx);
            }
          }

          function captureEphemeralImagePreviews(forceScan) {
            const candidates = [];
            for (const p of rawPathsForPreview) {
              candidates.push(p);
            }
            for (const p of reads) candidates.push(p);
            for (const p of writes) candidates.push(p);
            const imgPaths = Array.from(new Set(candidates)).filter((p) => /\.(png|jpe?g|webp|gif|bmp)$/i.test(String(p)));
            if (imgPaths.length === 0) return;

            // Prioritize /tmp/ and newest images so live/uncommitted previews appear immediately
            const prioritized = imgPaths.sort((a, b) => {
              const aTmp = String(a).startsWith('/tmp/') ? 0 : 1;
              const bTmp = String(b).startsWith('/tmp/') ? 0 : 1;
              return aTmp - bTmp;
            });

            let budgetBytes = 9200;
            for (const k of Object.keys(imagePreviews)) {
              budgetBytes -= String(imagePreviews[k] || '').length;
            }
            for (const rawCandidate of prioritized) {
              if (budgetBytes < 400) break;
              const key = normalizePath(rawCandidate);
              if (!forceScan && imagePreviews[key]) continue;
              const resolvedFile = fs.existsSync(rawCandidate)
                ? rawCandidate
                : (fs.existsSync('/' + key) ? '/' + key : (workspaceRoot && fs.existsSync(workspaceRoot + '/' + key) ? workspaceRoot + '/' + key : null));
              if (!resolvedFile) continue;

              let dataUri = '';
              try {
                const pyScript = [
                  'import sys, io, base64',
                  'from PIL import Image',
                  'im = Image.open(sys.argv[1]).convert("RGB")',
                  'im.thumbnail((320, 320))',
                  'buf = io.BytesIO()',
                  'im.save(buf, format="JPEG", quality=56, optimize=True)',
                  'print("data:image/jpeg;base64," + base64.b64encode(buf.getvalue()).decode("ascii"))'
                ].join('\n');
                const out = execFileSync('python3', ['-c', pyScript, resolvedFile], { timeout: 2000 }).toString().trim();
                if (out.startsWith('data:image/')) dataUri = out;
              } catch {
                try {
                  const imBuf = execFileSync('convert', [resolvedFile, '-auto-orient', '-thumbnail', '320x320', '-strip', '-quality', '56', 'jpeg:-'], { timeout: 2000, maxBuffer: 64 * 1024 });
                  if (imBuf && imBuf.length > 0 && imBuf.length <= 6500) {
                    dataUri = 'data:image/jpeg;base64,' + imBuf.toString('base64');
                  }
                } catch {
                  try {
                    const rawBytes = fs.readFileSync(resolvedFile);
                    if (rawBytes.length > 0 && rawBytes.length <= 5000) {
                      const ext = resolvedFile.toLowerCase().endsWith('.png') ? 'png' : 'jpeg';
                      dataUri = 'data:image/' + ext + ';base64,' + rawBytes.toString('base64');
                    }
                  } catch {}
                }
              }
              if (dataUri && dataUri.length <= budgetBytes) {
                const prevLen = imagePreviews[key] ? imagePreviews[key].length : 0;
                imagePreviews[key] = dataUri;
                budgetBytes -= (dataUri.length - prevLen);
              }
            }
          }

          function collectParts(evt) {
            const out = [];
            if (evt.part && typeof evt.part === 'object') out.push(evt.part);
            if (evt.properties && evt.properties.part && typeof evt.properties.part === 'object') out.push(evt.properties.part);
            if (Array.isArray(evt.parts)) evt.parts.forEach((x) => { if (x && typeof x === 'object') out.push(x); });
            if (evt.message && Array.isArray(evt.message.parts)) evt.message.parts.forEach((x) => { if (x && typeof x === 'object') out.push(x); });
            if (evt.item && typeof evt.item === 'object') out.push(evt.item);
            if (out.length === 0) out.push(evt);
            return out;
          }

          function buildTraceObject(isFinal) {
            return {
              thinking: thinkChunks.join('\n\n').slice(0, 3200),
              reads: Array.from(reads).slice(0, 24),
              writes: Array.from(writes).slice(0, 24),
              shell: Array.from(shell).slice(0, 20),
              searches: Array.from(searches).slice(0, 20),
              subagents: Array.from(subagents).slice(0, 12),
              skills: Array.from(skills).slice(0, 12),
              steps: steps.slice(0, 36),
              events: events.slice(0, 48),
              imagePreviews: imagePreviews,
              activePhase: isFinal ? '' : activePhase,
              activeTask: isFinal ? '' : activeTask,
              liveStep: liveStep,
            };
          }

          let checkRunId = null;
          let checkDisabled = !ghToken || !ghRepo || !ghSha || !ghRunId;
          let lastPatchMs = 0;
          let patchTimer = null;
          let inflightPromise = Promise.resolve();

          function ghRequest(method, apiPath, bodyObj) {
            if (checkDisabled) return Promise.resolve(null);
            return new Promise((resolve) => {
              const data = bodyObj ? JSON.stringify(bodyObj) : '';
              const req = https.request({
                hostname: 'api.github.com',
                path: apiPath,
                method: method,
                timeout: 2500,
                headers: {
                  'Authorization': 'Bearer ' + ghToken,
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'DarkMatter-CloudRunner/1.0',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(data)
                }
              }, (res) => {
                let raw = '';
                res.on('data', (c) => { if (raw.length < 32768) raw += c; });
                res.on('end', () => {
                  if (res.statusCode === 403 || res.statusCode === 404) {
                    checkDisabled = true;
                    resolve(null);
                    return;
                  }
                  try { resolve(res.statusCode >= 200 && res.statusCode < 300 ? JSON.parse(raw || '{}') : null); }
                  catch { resolve(null); }
                });
              });
              req.on('error', () => resolve(null));
              req.on('timeout', () => { req.destroy(); resolve(null); });
              if (data) req.write(data);
              req.end();
            });
          }

          async function pushCheckRunUpdate(isFinal) {
            if (checkDisabled) return;
            const payloadObj = buildTraceObject(isFinal);
            const b64 = Buffer.from(JSON.stringify(payloadObj), 'utf8').toString('base64');
            const outputBody = {
              title: 'Dark Matter Trace',
              summary: (activeTask || liveStep).slice(0, 140),
              text: '<<<DARK_MATTER_LIVE_TRACE>>>' + b64 + '<<<DARK_MATTER_LIVE_TRACE_END>>>'
            };
            if (!checkRunId) {
              const created = await ghRequest('POST', '/repos/' + ghRepo + '/check-runs', {
                name: 'dark-matter-trace',
                head_sha: ghSha,
                external_id: ghRunId,
                status: isFinal ? 'completed' : 'in_progress',
                conclusion: isFinal ? 'neutral' : undefined,
                output: outputBody
              });
              if (created && created.id) checkRunId = created.id;
            } else {
              const patchBody = isFinal
                ? { status: 'completed', conclusion: 'neutral', output: outputBody }
                : { output: outputBody };
              await ghRequest('PATCH', '/repos/' + ghRepo + '/check-runs/' + checkRunId, patchBody);
            }
          }

          let lastPreviewScanMs = 0;
          function scheduleLiveUpdate() {
            if (checkDisabled || patchTimer) return;
            const now = Date.now();
            const waitMs = Math.max(0, 1600 - (now - lastPatchMs));
            patchTimer = setTimeout(() => {
              patchTimer = null;
              lastPatchMs = Date.now();
              if (lastPatchMs - lastPreviewScanMs >= 2500) {
                lastPreviewScanMs = lastPatchMs;
                try { captureEphemeralImagePreviews(false); } catch {}
              }
              inflightPromise = inflightPromise.then(() => pushCheckRunUpdate(false));
            }, waitMs);
          }

          if (!checkDisabled) {
            inflightPromise = inflightPromise.then(() => pushCheckRunUpdate(false));
          }

          const rl = readline.createInterface({ input: process.stdin, crlfDelay: Infinity });
          rl.on('line', (line) => {
            try { fs.appendFileSync(rawFile, line + '\n'); } catch {}
            const t = line.trim();
            if (!t) return;
            if (!t.startsWith('{')) {
              nonJsonLines.push(line);
              return;
            }
            let evt;
            try { evt = JSON.parse(t); } catch { nonJsonLines.push(line); return; }
            parsedAnyJson = true;
            const delta = (evt.properties && typeof evt.properties.delta === 'string') ? evt.properties.delta : (typeof evt.delta === 'string' ? evt.delta : '');
            for (const p of collectParts(evt)) {
              const typ = String(p.type || evt.type || '').toLowerCase();
              if (typeof p.reasoning_content === 'string') appendThinking(p.reasoning_content, false);
              if (typeof p.reasoning === 'string') appendThinking(p.reasoning, false);
              if (typeof p.thinking === 'string') appendThinking(p.thinking, false);
              if (typeof evt.reasoning_content === 'string') appendThinking(evt.reasoning_content, false);
              if (typeof evt.reasoning === 'string') appendThinking(evt.reasoning, false);

              if (typ.includes('reason') || typ.includes('think')) {
                const r = delta || p.text || p.thinking || p.reasoning || evt.text || evt.thinking || '';
                if (typeof r === 'string' && r.trim()) {
                  appendThinking(r, Boolean(delta));
                }
              } else if (typ === 'step_start' || typ === 'step-start') {
                turnCount++;
                closeActiveThought(Date.now());
                flushRoundTextAsNarration();
                if (turnCount === 1 && steps.length === 0) {
                  activePhase = 'model';
                  activeTask = 'Running ' + modelName;
                  addStep('Model ' + modelName + ' analyzing request');
                }
              } else if (typ === 'step_finish' || typ === 'step-finish') {
                closeActiveThought(Date.now());
                const tokens = p.tokens || evt.tokens || {};
                const outTok = Number(tokens.output || 0);
                const reasonTok = Number(tokens.reasoning || 0);
                if (outTok > 0) totalOutputTokens += outTok;
                if (reasonTok > 0) totalReasoningTokens += reasonTok;
                const reason = String(p.reason || evt.reason || '').trim();
                if (reason) lastFinishReason = reason;
              } else if (typ === 'error') {
                closeActiveThought(Date.now());
                const errObj = p.error || evt.error || p;
                const msg = typeof errObj === 'string' ? errObj : (errObj.message || JSON.stringify(errObj));
                if (msg) {
                  activePhase = 'error';
                  activeTask = 'Error encountered';
                  addStep('Error: ' + String(msg).slice(0, 90));
                  pushEvent({ kind: 'error', tool: '', title: 'Error', detail: String(msg).slice(0, 260), output: '', durationMs: 0, status: 'error' });
                }
              } else if (typ.includes('tool') || p.tool || evt.tool) {
                const toolName = p.tool || p.name || p.toolName || evt.tool || evt.name || '';
                const st = p.state && typeof p.state === 'object' ? p.state : evt.state || {};
                const inp = st.input || p.input || p.args || p.arguments || evt.input || {};
                const callId = p.callID || p.callId || p.id || evt.callID || evt.id || '';
                recordTool(toolName, inp, st, callId);
              } else if (typ === 'text' || typ === 'assistant' || (p.type === 'text' && typeof p.text === 'string')) {
                const txt = delta || p.text || evt.text || evt.content || '';
                if (typeof txt === 'string' && txt.trim()) {
                  closeActiveThought(Date.now());
                  roundTextBuffer.push(txt);
                  allTextChunks.push(txt);
                  activePhase = 'text';
                  activeTask = 'Generating response';
                }
              }
            }
            scheduleLiveUpdate();
          });

          rl.on('close', async () => {
            if (patchTimer) {
              clearTimeout(patchTimer);
              patchTimer = null;
            }
            closeActiveThought(Date.now());
            let finalText = parsedAnyJson
              ? (roundTextBuffer.length > 0 ? roundTextBuffer : allTextChunks).join('\n').trim()
              : nonJsonLines.join('\n').trim();
            finalText = finalText.replace(/<(?:think|thinking|thought)>([\s\S]*?)<\/(?:think|thinking|thought)>/gi, (_, inner) => {
              if (inner && inner.trim()) {
                appendThinking(inner.trim(), false);
                closeActiveThought(Date.now());
              }
              return '';
            }).trim();

            if (thinkChunks.length === 0 && reads.size === 0 && writes.size === 0 && shell.size === 0 && searches.size === 0) {
              addStep('Ran ' + modelName + ' (' + agentMode + ' mode) — direct reply, no repo tools needed');
            }
            if (totalOutputTokens > 0 || totalReasoningTokens > 0) {
              const tokParts = [];
              if (totalReasoningTokens > 0) tokParts.push(totalReasoningTokens + ' reasoning');
              if (totalOutputTokens > 0) tokParts.push(totalOutputTokens + ' output');
              const finSuffix = lastFinishReason ? (lastFinishReason + ' · ') : '';
              addStep('Model finished (' + finSuffix + tokParts.join(', ') + ' tokens)');
            } else if (lastFinishReason) {
              addStep('Model finished (' + lastFinishReason + ')');
            }

            captureEphemeralImagePreviews(true);

            fs.writeFileSync(outFile, finalText);
            const finalTrace = buildTraceObject(true);
            fs.writeFileSync(traceFile, Buffer.from(JSON.stringify(finalTrace), 'utf8').toString('base64'));
            const flushDone = inflightPromise.then(() => pushCheckRunUpdate(true)).catch(() => {});
            await Promise.race([flushDone, new Promise((r) => setTimeout(r, 1600))]);
          });
          NODE_EOF

          HAD_OPENCODE_KEY=0
          if [ -n "${OPENCODE_API_KEY:-}" ]; then
            HAD_OPENCODE_KEY=1
          else
            unset OPENCODE_API_KEY
          fi

          run_opencode() {
            opencode run "${OPENCODE_FLAGS[@]}" -m "$MODEL" "$INSTRUCTIONS"
          }

          set +e
          run_opencode 2>"$ERR_FILE" | node /tmp/dm_live.js
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$HAD_OPENCODE_KEY" -eq 1 ] && { [ $STATUS -ne 0 ] || [ ! -s "$RAW_JSON_FILE" ]; }; then
            if grep -qiE "Free usage limit|rate limit|401|unauthorized|quota" "$ERR_FILE" "$RAW_JSON_FILE" 2>/dev/null; then
              echo "Retrying OpenCode CLI with public free tier..."
              set +e
              env -u OPENCODE_API_KEY opencode run "${OPENCODE_FLAGS[@]}" -m "$MODEL" "$INSTRUCTIONS" 2>"$ERR_FILE" | node /tmp/dm_live.js
              STATUS=${PIPESTATUS[0]}
              set -e
            fi
          fi

          if [ ! -s "$OUT_FILE" ] && [ -s "$RAW_JSON_FILE" ]; then
            cp "$RAW_JSON_FILE" "$OUT_FILE"
          fi

          PR_URL=""
          PR_ERROR=""
          COMMIT_URL=""
          BRANCH_NAME=""
          CHANGED_FILES=""
          FILE_STATS_B64=""
          if [ "$AGENT_MODE" != "plan" ]; then
            WORK_DIR="$PWD" START_MARKER="$DM_START_MARKER" node -e '
              const fs = require("fs");
              const path = require("path");
              const workDir = process.env.WORK_DIR;
              const startMarker = process.env.START_MARKER;
              let startMs = 0;
              try { startMs = fs.statSync(startMarker).mtimeMs; } catch {}
              const docRe = /\.(pdf|xlsx|xls|docx|doc|pptx|ppt|csv|zip|epub|odt|ods|odp|rtf)$/i;
              function promoteTmpDocs(dir, depth) {
                if (depth > 2) return;
                let entries = [];
                try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { return; }
                for (const e of entries) {
                  if (e.name.startsWith(".") || e.name === "dm_artifacts") continue;
                  const full = path.join(dir, e.name);
                  if (e.isDirectory()) promoteTmpDocs(full, depth + 1);
                  else if (e.isFile() && docRe.test(e.name)) {
                    try {
                      const st = fs.statSync(full);
                      if (st.size > 0 && st.size <= 20 * 1024 * 1024 && (startMs === 0 || st.mtimeMs >= startMs - 1000)) {
                        const dest = path.join(workDir, e.name);
                        if (!fs.existsSync(dest)) fs.copyFileSync(full, dest);
                      }
                    } catch {}
                  }
                }
              }
              promoteTmpDocs("/tmp", 0);
            ' 2>/dev/null || true
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "feat: ${TASK_THREAD_ID:-update}" || true
            fi
            COMMIT_SHA=$(git rev-parse HEAD 2>/dev/null || true)
            if [ -n "$INITIAL_HEAD_SHA" ] && [ -n "$COMMIT_SHA" ] && [ "$INITIAL_HEAD_SHA" != "$COMMIT_SHA" ]; then
              CHANGED_FILES=$(git diff --name-only "$INITIAL_HEAD_SHA" "$COMMIT_SHA" | grep -v -E '(^|/)(page[_-]?[0-9]+|pg[_-]?[0-9]+|slide[_-]?[0-9]+|preview[_-]?[0-9]+|render[_-]?[0-9]+)\.(png|jpe?g|webp)$' | grep -v -E '(^|/)(make|generate|create|render|verify|check)_.*\.(py|sh)$' | tr '\n' ',' | sed 's/,$//')
              FILE_STATS_B64=$(INITIAL_SHA="$INITIAL_HEAD_SHA" HEAD_SHA="$COMMIT_SHA" node -e '
                const { execFileSync } = require("child_process");
                const base = process.env.INITIAL_SHA;
                const head = process.env.HEAD_SHA;
                const scratchRe = /(^|\/)(page[_-]?\d+|pg[_-]?\d+|slide[_-]?\d+|preview[_-]?\d+|render[_-]?\d+|thumb[_-]?\d+)\.(png|jpe?g|webp)$|(^|\/)(make|generate|create|render|verify|check)_.*\.(py|sh)$/i;
                const statusOut = execFileSync("git", ["diff", "--name-status", base, head]).toString();
                const numOut = execFileSync("git", ["diff", "--numstat", base, head]).toString();
                const statusMap = {};
                for (const l of statusOut.trim().split(/\r?\n/)) {
                  if (!l) continue;
                  const parts = l.split(/\t/);
                  if (parts.length >= 2) statusMap[parts[parts.length - 1]] = parts[0].slice(0, 1);
                }
                const stats = [];
                let patchBudget = 11000;
                for (const l of numOut.trim().split(/\r?\n/)) {
                  if (!l) continue;
                  const parts = l.split(/\t/);
                  if (parts.length < 3) continue;
                  const path = parts.slice(2).join("\t");
                  if (scratchRe.test(path)) continue;
                  let patch = "";
                  if (patchBudget > 300) {
                    try {
                      const rawDiff = execFileSync("git", ["diff", "-U2", "--no-color", base, head, "--", path], { maxBuffer: 512 * 1024 }).toString();
                      const diffLines = rawDiff.split(/\r?\n/);
                      const hunkStart = diffLines.findIndex(dl => dl.startsWith("@@"));
                      const relevant = (hunkStart >= 0 ? diffLines.slice(hunkStart) : diffLines).slice(0, 38);
                      let joined = relevant.join("\n").slice(0, Math.min(1150, patchBudget));
                      if (diffLines.length - (hunkStart >= 0 ? hunkStart : 0) > 38) joined += "\n... (diff truncated)";
                      patch = joined;
                      patchBudget -= patch.length;
                    } catch {}
                  }
                  stats.push({
                    path,
                    status: statusMap[path] || "M",
                    additions: parseInt(parts[0], 10) || 0,
                    deletions: parseInt(parts[1], 10) || 0,
                    patch
                  });
                  if (stats.length >= 40) break;
                }
                process.stdout.write(Buffer.from(JSON.stringify(stats), "utf8").toString("base64"));
              ' 2>/dev/null || true)

              DEST_BRANCH="${TARGET_BRANCH:-${DEFAULT_BRANCH:-main}}"
              if [ "$BRANCH_STRATEGY" = "new_pr_branch" ]; then
                BRANCH_NAME="dark-matter/cloud-${GITHUB_RUN_ID}"
                git checkout -B "$BRANCH_NAME"
                if git push -u origin "$BRANCH_NAME" 2>/tmp/git_push_err.txt; then
                  COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}"
                  PR_OUT=$(gh pr create --base "$DEST_BRANCH" --head "$BRANCH_NAME" --title "Update: ${TASK_THREAD_ID:-Cloud Agent Update}" --body "Automated OpenCode cloud run #${GITHUB_RUN_ID} using model \`$MODEL\`. Changed files: ${CHANGED_FILES}" 2>&1 || true)
                  PR_URL=$(printf '%s\n' "$PR_OUT" | grep -E '^https://' | tail -n 1 || true)
                  if [ -z "$PR_URL" ]; then
                    PR_ERROR=$(printf '%s' "$PR_OUT" | tr '\n' ' ' | head -c 220)
                  fi
                else
                  PR_ERROR=$(cat /tmp/git_push_err.txt | tr '\n' ' ' | head -c 220)
                  BRANCH_NAME=""
                fi
              else
                if git push origin HEAD:"refs/heads/$DEST_BRANCH" 2>/tmp/git_push_err.txt; then
                  BRANCH_NAME="$DEST_BRANCH"
                  COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}"
                else
                  # Fallback only if target branch is protected from direct push
                  BRANCH_NAME="dark-matter/cloud-${GITHUB_RUN_ID}"
                  git checkout -B "$BRANCH_NAME"
                  if git push -u origin "$BRANCH_NAME" 2>>/tmp/git_push_err.txt; then
                    COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}"
                    PR_OUT=$(gh pr create --base "$DEST_BRANCH" --head "$BRANCH_NAME" --title "Update: ${TASK_THREAD_ID:-Cloud Agent Update}" --body "Branch protection on \`$DEST_BRANCH\` required a PR. Run #${GITHUB_RUN_ID} using \`$MODEL\`." 2>&1 || true)
                    PR_URL=$(printf '%s\n' "$PR_OUT" | grep -E '^https://' | tail -n 1 || true)
                    PR_ERROR="Direct push to '$DEST_BRANCH' was blocked by branch protection; opened PR instead."
                  else
                    PR_ERROR=$(cat /tmp/git_push_err.txt | tr '\n' ' ' | head -c 220)
                    BRANCH_NAME=""
                  fi
                fi
              fi
            fi
          fi

          ARTIFACTS_B64=""
          ARTIFACTS_B64=$(OUT_DIR="/tmp/dm_artifacts" WORK_DIR="$PWD" START_MARKER="$DM_START_MARKER" node -e '
            const fs = require("fs");
            const path = require("path");
            const { execFileSync } = require("child_process");
            const outDir = process.env.OUT_DIR;
            const workDir = process.env.WORK_DIR;
            const startMarker = process.env.START_MARKER;
            let startMs = 0;
            try { startMs = fs.statSync(startMarker).mtimeMs; } catch {}

            fs.rmSync(outDir, { recursive: true, force: true });
            fs.mkdirSync(outDir, { recursive: true });

            const deliverableDocRe = /\.(pdf|xlsx|xls|docx|doc|pptx|ppt|csv|zip|epub|odt|ods|odp|rtf)$/i;
            const binaryPriorityRe = /\.(pdf|xlsx|xls|docx|doc|pptx|ppt|csv|zip|epub|odt|ods|odp|rtf|png|jpe?g|webp|gif|svg)$/i;
            const scratchImgRe = /^(page[_-]?\d+|pg[_-]?\d+|slide[_-]?\d+|screen[_-]?\d+|preview[_-]?\d+|render[_-]?\d+|thumb[_-]?\d+|test[_-].*|verify[_-].*|check[_-].*|tmp[_-].*|debug[_-].*)\.(png|jpe?g|webp)$/i;
            const ignoredTmp = new Set(["dm_live.js", "opencode_events.jsonl", "opencode_reply.txt", "opencode_err.txt", "opencode_trace.b64", "dark-matter-opencode.json", "git_push_err.txt", "dm_run_started_marker", "dm_artifacts"]);

            const found = [];
            function scanTmp(dir, depth) {
              if (depth > 3) return;
              let entries = [];
              try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { return; }
              for (const e of entries) {
                if (e.name.startsWith(".") || ignoredTmp.has(e.name)) continue;
                const full = path.join(dir, e.name);
                if (e.isDirectory()) {
                  scanTmp(full, depth + 1);
                } else if (e.isFile() && deliverableDocRe.test(e.name)) {
                  try {
                    const st = fs.statSync(full);
                    if (st.size > 0 && st.size <= 20 * 1024 * 1024 && (startMs === 0 || st.mtimeMs >= startMs - 1000)) {
                      const promoted = path.join(workDir, e.name);
                      const relPath = fs.existsSync(promoted) ? e.name : full;
                      found.push({ abs: full, rel: relPath, priority: 0 });
                    }
                  } catch {}
                }
              }
            }
            scanTmp("/tmp", 0);

            try {
              const statusOut = execFileSync("git", ["status", "--porcelain"], { cwd: workDir }).toString();
              for (const line of statusOut.split(/\r?\n/)) {
                if (line.length < 4) continue;
                let rel = line.slice(3).trim();
                if (rel.includes(" -> ")) rel = rel.split(" -> ").pop().trim();
                rel = rel.replace(/^"|"$/g, "");
                const baseName = path.basename(rel);
                if (scratchImgRe.test(baseName)) continue;
                const abs = path.join(workDir, rel);
                if (fs.existsSync(abs) && fs.statSync(abs).isFile() && binaryPriorityRe.test(rel)) {
                  found.push({ abs, rel, priority: deliverableDocRe.test(rel) ? 0 : 1 });
                }
              }
            } catch {}

            // Also include recently modified workspace binary deliverables
            try {
              const recent = execFileSync("find", [workDir, "-maxdepth", "4", "-not", "-path", "*/.git/*", "-not", "-path", "*/node_modules/*", "-type", "f", "-newer", startMarker], { timeout: 2500 }).toString();
              for (const full of recent.split(/\r?\n/)) {
                if (!full || !binaryPriorityRe.test(full)) continue;
                const baseName = path.basename(full);
                if (scratchImgRe.test(baseName)) continue;
                const rel = path.relative(workDir, full).replace(/\\/g, "/");
                if (rel && !rel.startsWith("..")) {
                  found.push({ abs: full, rel, priority: deliverableDocRe.test(rel) ? 0 : 1 });
                }
              }
            } catch {}

            found.sort((a, b) => a.priority - b.priority);
            const seen = new Set();
            const exported = [];
            let totalBytes = 0;
            for (const item of found) {
              if (exported.length >= 20 || seen.has(item.rel)) continue;
              try {
                const st = fs.statSync(item.abs);
                if (totalBytes + st.size > 24 * 1024 * 1024) continue;
                const cleanSub = item.rel.replace(/^\/+/, "");
                const dest = path.join(outDir, cleanSub);
                fs.mkdirSync(path.dirname(dest), { recursive: true });
                fs.copyFileSync(item.abs, dest);
                seen.add(item.rel);
                exported.push(item.rel);
                totalBytes += st.size;
              } catch {}
            }
            if (exported.length > 0) {
              process.stdout.write(Buffer.from(JSON.stringify(exported), "utf8").toString("base64"));
            }
          ' 2>/dev/null || true)

          printf '\n%s\n' '<<<DARK_MATTER_REPLY_START>>>'
          if [ -s "$OUT_FILE" ]; then
            cat "$OUT_FILE"
          elif [ -s "$ERR_FILE" ]; then
            echo "OpenCode CLI failed (exit $STATUS):"
            cat "$ERR_FILE"
          else
            echo "OpenCode CLI finished (exit $STATUS) with empty output."
          fi
          printf '\n%s\n' '<<<DARK_MATTER_REPLY_END>>>'
          if [ -n "$BRANCH_NAME" ]; then
            printf '<<<DARK_MATTER_BRANCH>>>%s<<<DARK_MATTER_BRANCH_END>>>\n' "$BRANCH_NAME"
          fi
          if [ -n "$CHANGED_FILES" ]; then
            printf '<<<DARK_MATTER_FILES>>>%s<<<DARK_MATTER_FILES_END>>>\n' "$CHANGED_FILES"
          fi
          if [ -n "$FILE_STATS_B64" ]; then
            printf '<<<DARK_MATTER_FILE_STATS>>>%s<<<DARK_MATTER_FILE_STATS_END>>>\n' "$FILE_STATS_B64"
          fi
          if [ -n "$ARTIFACTS_B64" ]; then
            printf '<<<DARK_MATTER_ARTIFACTS>>>%s<<<DARK_MATTER_ARTIFACTS_END>>>\n' "$ARTIFACTS_B64"
          fi
          if [ -s "$TRACE_B64_FILE" ]; then
            printf '<<<DARK_MATTER_TRACE>>>%s<<<DARK_MATTER_TRACE_END>>>\n' "$(cat "$TRACE_B64_FILE")"
          fi
          if [ -n "$COMMIT_URL" ]; then
            printf '<<<DARK_MATTER_COMMIT_URL>>>%s<<<DARK_MATTER_COMMIT_URL_END>>>\n' "$COMMIT_URL"
          fi
          if [ -n "$PR_URL" ]; then
            printf '<<<DARK_MATTER_PR_URL>>>%s<<<DARK_MATTER_PR_URL_END>>>\n' "$PR_URL"
          fi
          if [ -n "$PR_ERROR" ]; then
            printf '<<<DARK_MATTER_PR_ERROR>>>%s<<<DARK_MATTER_PR_ERROR_END>>>\n' "$PR_ERROR"
          fi

          if [ $STATUS -ne 0 ] && [ ! -s "$OUT_FILE" ]; then
            exit $STATUS
          fi

      - name: Upload deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-matter-files-${{ github.run_id }}
          path: /tmp/dm_artifacts
          if-no-files-found: ignore
          retention-days: 14

  opencode-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Run OpenCode PR Agent
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
