services:
  - type: web
    name: ajui-backend
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: backend
    # Use the npm cache and skip audit/funding noise. Dev dependencies must
    # remain available because the build command runs the TypeScript compiler.
    # TypeScript and its Node typings are build-time devDependencies, so a
    # production-only install cannot run the required type-check on a clean host.
    buildCommand: npm ci --no-audit --no-fund --prefer-offline && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: 4h
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "AGB <noreply@annaigoldenbuilders.online>"
      - key: GMAIL_USER
        value: antigravity20263.0.3.0@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MOBILE_APP_URL
        value: "https://localhost,http://localhost,capacitor://localhost"
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: QR_BASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
