<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGB - Annai Golden Builders</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f6f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 40px 32px; max-width: 420px; width: 90%; text-align: center; }
    .logo { width: 100px; height: 100px; margin: 0 auto 20px; }
    h1 { font-size: 22px; color: #002263; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #98a2b3; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.05em; }
    .desc { font-size: 14px; color: #475467; line-height: 1.6; margin-bottom: 28px; }
    .btn { display: block; width: 100%; padding: 14px; background: #002263; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; transition: background 0.2s; margin-bottom: 12px; }
    .btn:hover { background: #001a4d; }
    .btn.outline { background: transparent; color: #002263; border: 1.5px solid #002263; }
    .btn.outline:hover { background: #f0f4ff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#c9a227"/>
            <stop offset="100%" style="stop-color:#e8c840"/>
          </linearGradient>
        </defs>
        <path d="M100 20 L140 70 Q160 95 140 120 L120 140 Q110 150 100 145 Q90 150 80 140 L60 120 Q40 95 60 70 Z" fill="url(#g)" opacity="0.9"/>
        <text x="100" y="180" text-anchor="middle" fill="#c9a227" font-size="28" font-weight="700" font-family="sans-serif">ANNAI</text>
        <text x="100" y="198" text-anchor="middle" fill="#c9a227" font-size="11" font-weight="400" font-family="sans-serif" letter-spacing="2">GOLDEN BUILDERS</text>
      </svg>
    </div>
    <h1>Annai Golden Builders</h1>
    <p class="subtitle">Operations Workspace</p>
    <p class="desc">
      Welcome to AGB. Use the links below to complete your account setup or reset your password.
    </p>
    <a href="reset-password.html" class="btn">Reset Password</a>
    <a href="signup.html" class="btn outline">Complete Signup</a>
  </div>
</body>
</html>
