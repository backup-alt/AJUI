<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    (function () {
      var segments = window.location.pathname.replace(/^\/+|\/+$/g, "").split("/");
      var appIndex = segments.indexOf("AJUI");
      var redirectPath = "/";
      if (appIndex >= 0 && appIndex < segments.length - 1) {
        redirectPath = "/" + segments.slice(appIndex + 1).join("/") + window.location.search + window.location.hash;
      }
      window.location.replace(redirectPath);
    })();
  </script>
</head>
<body>
  <p>Loading...</p>
</body>
</html>
