<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGB - Annai Golden Builders</title>
  <script>
    // GitHub Pages SPA redirect: preserve the hash route on direct URL access.
    // When a user visits https://backup-alt.github.io/AJUI/#/login directly,
    // GitHub Pages serves this 404.html. We store the full path and redirect
    // to index.html where Angular's hash router can pick it up.
    (function () {
      var pathSegmentsToKeep = 1; // /AJUI/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
